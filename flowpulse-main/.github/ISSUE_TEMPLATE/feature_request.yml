name: 💡 Feature Request
description: Propose a new feature or enhancement for FlowPulse
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an idea for FlowPulse!
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement / Context
      description: Is your feature request related to a problem? Please describe.
      placeholder: e.g. I am always frustrated when hospital transport delays are not surfaced in the ripple analysis...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Feature
      description: A clear and concise description of what you want to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Solutions Considered
      description: A clear and concise description of any alternative solutions or features you've considered.
