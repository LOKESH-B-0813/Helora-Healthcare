name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-verification:
    name: Web Application (Typecheck & Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flowpulse_work
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: flowpulse_work/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Typecheck
        run: npm run typecheck

      - name: Run Unit & Algorithm Tests
        run: npm test

      - name: Next.js Production Build
        run: npm run build

  mobile-verification:
    name: Mobile Application (Typecheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Strict TypeScript Typecheck
        run: npm run typecheck
