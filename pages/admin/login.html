<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Helora</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
</head>

<body>
    <div class="split-layout">
        <!-- Left Side -->
        <div class="split-left"
            style="background-image: url('https://images.unsplash.com/photo-1550751827-4bd374c3f58b?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');">
            <div class="split-left-overlay overlay-admin"></div>
            <div class="split-left-content">
                <a href="../../index.html"
                    style="display: flex; align-items: center; gap: 0.5rem; font-size: 1.5rem; font-weight: 800; color: white; margin-bottom: 2rem; font-family: var(--font-heading);">
                    <img src="../../assets/logo.png" alt="Helora"
                        style="height: 40px; background: white; border-radius: 50%; padding: 4px;">
                    Helora Healthcare
                </a>
                <h1>Admin Control Center</h1>
                <p>Securely manage hospital resources, staff permissions, and system configurations.</p>
                <div id="dynamic-quote">"Empowering healthcare through innovation."</div>
                <div style="margin-top: 4rem; display: flex; align-items: center; gap: 1rem; opacity: 0.8;">
                    <ion-icon name="mail" style="font-size: 1.5rem;"></ion-icon>
                    <span style="font-weight: 500;">helorahealthcare@gmail.com</span>
                </div>
            </div>
        </div>

        <!-- Right Side -->
        <div class="split-right">
            <div class="auth-card-modern">
                <div class="section-title" style="margin-bottom: 2rem;">
                    <div
                        style="background: #fef2f2; width: 70px; height: 70px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem auto; box-shadow: 0 4px 10px rgba(239, 68, 68, 0.2);">
                        <ion-icon name="shield-checkmark" style="font-size: 2.2rem; color: #ef4444;"></ion-icon>
                    </div>
                    <h2
                        style="font-size: 2rem; margin-bottom: 0.5rem; color: var(--text-primary); background: none; -webkit-text-fill-color: var(--text-primary);">
                        Admin Portal</h2>
                    <p style="color: var(--text-secondary);">Secure Access Only</p>
                </div>

                <form id="admin-login-form" novalidate>
                    <div class="form-group">
                        <label>Email Address</label>
                        <input type="email" id="email" required placeholder="admin@helora.com">
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="password" required placeholder="••••••••">
                    </div>
                    <button type="submit" class="btn btn-primary"
                        style="width: 100%; padding: 1rem; font-size: 1.1rem; border-radius: 0.75rem;">Login to
                        Dashboard</button>
                    <p id="auth-status" role="status" aria-live="polite"
                        style="display:none; margin-top:1rem; text-align:center;"></p>

                    <div style="margin-top: 1.5rem; text-align: center; font-size: 0.95rem;">
                        <a href="#" id="forgot-password-link"
                            style="color: var(--text-secondary); transition: color 0.2s;"
                            onmouseover="this.style.color='var(--primary-color)'"
                            onmouseout="this.style.color='var(--text-secondary)'">Forgot Password?</a>
                    </div>
                    <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary);">
                        <a href="../../index.html" style="color: var(--text-secondary);">&larr; Back to Home</a>
                    </p>
                </form>
            </div>
        </div>
    </div>

    <!-- Ionicons -->
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <script src="../../js/ui-enhancements.js"></script>
    <script type="module">
        import { login, resetPassword, verifySession } from "../../js/auth.js";

        const form = document.getElementById('admin-login-form');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const status = document.getElementById('auth-status');
        const submitButton = form.querySelector('button[type="submit"]');

        function showStatus(message, isError = true) {
            status.textContent = message;
            status.style.display = 'block';
            status.style.color = isError ? '#b42318' : 'var(--primary-color)';
        }

        async function redirectExistingAdminSession() {
            try {
                if (await verifySession(['admin', 'super_admin'])) window.location.href = 'dashboard.html';
            } catch (error) {
                console.error('Existing Appwrite session check failed:', error);
            }
        }

        const existingSessionCheck = redirectExistingAdminSession();

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = emailInput.value.trim();
            const password = passwordInput.value;
            if (!email || !password) {
                showStatus('Enter both your email address and password.');
                return;
            }

            const originalText = submitButton.innerText;
            submitButton.innerText = 'Authenticating...';
            submitButton.disabled = true;
            showStatus('');
            status.style.display = 'none';

            try {
                await existingSessionCheck;
                await login(email, password, ['admin', 'super_admin']);
                showStatus('Login successful. Redirecting...', false);
            } catch (error) {
                console.error("Login Error:", error);
                showStatus(error.message || 'Unable to sign in. Check your credentials and try again.');
            } finally {
                submitButton.innerText = originalText;
                submitButton.disabled = false;
            }
        });

        submitButton.addEventListener('click', (event) => {
            event.preventDefault();
            form.requestSubmit(submitButton);
        });

        form.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                event.preventDefault();
                form.requestSubmit(submitButton);
            }
        });

        document.getElementById('forgot-password-link').addEventListener('click', async (e) => {
            e.preventDefault();
            let email = document.getElementById('email').value;
            if (!email) {
                email = prompt("Enter your admin email address to receive a password reset link:");
            }
            if (email) {
                try {
                    await resetPassword(email, '/pages/admin/recovery.html');
                    showStatus('Password reset email sent. Check your inbox.', false);
                } catch (error) {
                    console.error('Password reset error:', error);
                    showStatus(error.message || 'Unable to send the password reset email.');
                }
            }
        });
    </script>
</body>

</html>
