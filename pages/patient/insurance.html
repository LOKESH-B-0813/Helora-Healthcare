<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Insurance - Helora Patient</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/patient-portal.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <div class="logo-img">
                        <img src="../../assets/logo.png" alt="Logo"
                            style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                    <span>Helora Patient</span>
                </div>
                <div class="nav-links">
                    <a href="dashboard.html" data-back-link>Dashboard</a>
                    <a href="records.html" data-portal-link>Records</a>
                    <a href="profile.html" data-portal-link>Profile</a>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline" id="logout-btn" type="button">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 2rem 0;">
        <div class="patient-back-row">
            <a class="btn btn-outline" data-back-link href="dashboard.html">← Back to Dashboard</a>
        </div>
        <div id="demo-banner" class="demo-banner" hidden>
            <strong>Demonstration mode - test data only.</strong>
            This labelled [TEST-DATA] policy is fictional and for demonstration only.
        </div>
        <p id="page-error" class="page-error" hidden></p>

        <div class="section-head">
            <h1>Insurance Summary (<span id="insurance-total">…</span>)</h1>
        </div>
        <div id="insurance-list" class="record-list"><p class="record-muted">Loading...</p></div>
    </main>

    <script type="module">
        import { summarize } from '../../js/patient-portal-data.js';
        import {
            appendField, bindLogout, formatDate, hideError,
            requirePatientDataset, showEmpty, showError, withDemo,
        } from '../../js/patient-portal.js';

        document.querySelectorAll('a[data-portal-link]').forEach((link) => {
            link.setAttribute('href', withDemo(link.getAttribute('href')));
        });

        async function load() {
            hideError('page-error');
            const loaded = await requirePatientDataset();
            if (!loaded) return;
            const { dataset } = loaded;
            document.getElementById('insurance-total').textContent = summarize(dataset).insurance;

            const container = document.getElementById('insurance-list');
            container.replaceChildren();
            if (!dataset.insurance.length) {
                showEmpty('insurance-list', 'No insurance information available.');
                return;
            }
            dataset.insurance.forEach((row) => {
                const item = document.createElement('article');
                item.className = 'record-item';
                appendField(item, 'Provider', row.provider || row.provider_name);
                appendField(item, 'Policy', row.policy_number);
                appendField(item, 'Plan', row.plan_name);
                appendField(item, 'Status', row.status);
                appendField(item, 'Coverage', row.coverage_details);
                appendField(item, 'Valid from', formatDate(row.valid_from));
                appendField(item, 'Valid until', formatDate(row.valid_until));
                container.appendChild(item);
            });
        }

        bindLogout();
        load().catch((error) => {
            console.error(error);
            showError('page-error', error.message || 'Unable to load insurance records.');
            showEmpty('insurance-list', 'Could not load insurance records.');
        });
    </script>
</body>

</html>
