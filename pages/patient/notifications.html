<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - Helora Patient</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/patient-portal.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <div class="logo-img">
                        <img src="../../assets/logo.png" alt="Logo"
                            style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                    <span>Helora Patient</span>
                </div>
                <div class="nav-links">
                    <a href="dashboard.html" data-back-link>Dashboard</a>
                    <a href="appointments.html" data-portal-link>Appointments</a>
                    <a href="profile.html" data-portal-link>Profile</a>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline" id="logout-btn" type="button">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 2rem 0;">
        <div class="patient-back-row">
            <a class="btn btn-outline" data-back-link href="dashboard.html">← Back to Dashboard</a>
        </div>
        <div id="demo-banner" class="demo-banner" hidden>
            <strong>Demonstration mode - test data only.</strong>
            These labelled [TEST-DATA] notifications are fictional.
        </div>
        <p id="page-error" class="page-error" hidden></p>

        <div class="section-head">
            <h1>Notifications (<span id="notif-total">…</span>)</h1>
        </div>
        <div id="notifications-list" class="record-list"><p class="record-muted">Loading...</p></div>
    </main>

    <script type="module">
        import { getAuthToken } from '../../js/auth.js';
        import { summarize } from '../../js/patient-portal-data.js';
        import {
            appendField, bindLogout, formatDate, hideError, isDemoMode,
            requirePatientDataset, showEmpty, showError, withDemo,
        } from '../../js/patient-portal.js';
        import { apiUrl } from '../../js/auth.js';

        document.querySelectorAll('a[data-portal-link]').forEach((link) => {
            link.setAttribute('href', withDemo(link.getAttribute('href')));
        });

        let datasetRef = null;

        async function markRead(notificationId, button) {
            button.disabled = true;
            try {
                if (isDemoMode()) {
                    const row = datasetRef.notifications.find((n) => n.$id === notificationId);
                    if (row) row.is_read = true;
                } else {
                    const token = await getAuthToken();
                    const response = await fetch(apiUrl(`/api/notifications/${encodeURIComponent(notificationId)}/read`), {
                        method: 'PATCH',
                        headers: { Authorization: `Bearer ${token}` },
                    });
                    const data = await response.json().catch(() => ({}));
                    if (!response.ok || data.success === false) {
                        throw new Error((data.error && (data.error.message || data.error)) || 'Unable to mark as read.');
                    }
                    const row = datasetRef.notifications.find((n) => n.$id === notificationId);
                    if (row) row.is_read = true;
                }
                render(datasetRef);
            } catch (error) {
                showError('page-error', error.message || 'Unable to update notification.');
                button.disabled = false;
            }
        }

        function render(dataset) {
            datasetRef = dataset;
            document.getElementById('notif-total').textContent = summarize(dataset).notifications;
            const container = document.getElementById('notifications-list');
            container.replaceChildren();
            if (!dataset.notifications.length) {
                showEmpty('notifications-list', 'No notifications yet.');
                return;
            }
            dataset.notifications.forEach((row) => {
                const item = document.createElement('article');
                item.className = 'record-item';
                const title = document.createElement('h4');
                title.textContent = row.title || 'Notification';
                if (!row.is_read) {
                    const dot = document.createElement('span');
                    dot.className = 'unread-dot';
                    dot.textContent = 'UNREAD';
                    title.appendChild(dot);
                }
                item.appendChild(title);
                appendField(item, null, row.message);
                appendField(item, 'Type', row.type);
                appendField(item, 'Date', formatDate(row.created_at));
                if (!row.is_read) {
                    const button = document.createElement('button');
                    button.className = 'btn btn-outline';
                    button.type = 'button';
                    button.textContent = 'Mark as read';
                    button.addEventListener('click', () => markRead(row.$id, button));
                    item.appendChild(button);
                }
                container.appendChild(item);
            });
        }

        async function load() {
            hideError('page-error');
            const loaded = await requirePatientDataset();
            if (!loaded) return;
            render(loaded.dataset);
        }

        bindLogout();
        load().catch((error) => {
            console.error(error);
            showError('page-error', error.message || 'Unable to load notifications.');
            showEmpty('notifications-list', 'Could not load notifications.');
        });
    </script>
</body>

</html>
