<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Profile - Helora Patient</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="../../css/patient-portal.css">
</head>

<body>
    <header>
        <div class="container">
            <nav>
                <div class="logo">
                    <div class="logo-img">
                        <img src="../../assets/logo.png" alt="Logo"
                            style="width: 100%; height: 100%; object-fit: contain;">
                    </div>
                    <span>Helora Patient</span>
                </div>
                <div class="nav-links">
                    <a href="dashboard.html" data-back-link>Dashboard</a>
                    <a href="appointments.html" data-portal-link>Appointments</a>
                    <a href="records.html" data-portal-link>Records</a>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <button class="btn btn-outline" id="logout-btn" type="button">Logout</button>
                </div>
            </nav>
        </div>
    </header>

    <main class="container" style="padding: 2rem 0;">
        <div class="patient-back-row">
            <a class="btn btn-outline" data-back-link href="dashboard.html">← Back to Dashboard</a>
        </div>
        <div id="demo-banner" class="demo-banner" hidden>
            <strong>Demonstration mode - test data only.</strong>
            This labelled [TEST-DATA] profile is fictional.
        </div>
        <p id="page-error" class="page-error" hidden></p>

        <h1>My Profile</h1>
        <div id="profile-card" class="detail-grid"><p class="record-muted">Loading...</p></div>
    </main>

    <script type="module">
        import {
            appendField, bindLogout, hideError,
            requirePatientDataset, showError, withDemo,
        } from '../../js/patient-portal.js';

        document.querySelectorAll('a[data-portal-link]').forEach((link) => {
            link.setAttribute('href', withDemo(link.getAttribute('href')));
        });

        async function load() {
            hideError('page-error');
            const loaded = await requirePatientDataset();
            if (!loaded) return;
            const { user, dataset } = loaded;
            const profile = dataset.profile || {};

            const container = document.getElementById('profile-card');
            container.replaceChildren();
            const card = document.createElement('article');
            card.className = 'record-item';
            appendField(card, 'Name', profile.full_name || user.email);
            appendField(card, 'Email', user.email || profile.email);
            appendField(card, 'Phone', profile.phone);
            appendField(card, 'Status', profile.status || 'Active');
            appendField(card, 'Role', profile.role || user.role || 'patient');
            container.appendChild(card);
        }

        bindLogout();
        load().catch((error) => {
            console.error(error);
            showError('page-error', error.message || 'Unable to load your profile.');
        });
    </script>
</body>

</html>
